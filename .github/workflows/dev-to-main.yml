name: Auto merge dev into main

on:
  push:
    branches:
      - dev

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev and restore excluded files
        run: |
          MAIN_HEAD=$(git rev-parse HEAD)

          git fetch origin dev

          # Read the exclusion list from dev BEFORE merging. It must come from dev (not
          # the working tree): .dev-files is itself excluded, so it does not exist on
          # main and the merge may delete it from the tree — reading it afterward would
          # silently skip all exclusions. Strip CRLF so the patterns parse cleanly when
          # used as a .gitignore file below.
          EXCLUDE_FILE="$(mktemp)"
          git show origin/dev:.dev-files 2>/dev/null | tr -d '\r' > "$EXCLUDE_FILE" || true

          # List tracked paths in the *current* index that match .dev-files, using real
          # .gitignore semantics via git's own matcher: a bare name like
          # ".instructions.md" matches at ANY depth, while a leading "/" anchors to the
          # repo root. (The previous implementation fed each line to git as a pathspec,
          # which is root-anchored — so bare names only matched root-level files and
          # subdirectory matches such as scripts/.instructions.md leaked into main.)
          # core.excludesFile is pinned to /dev/null so only .dev-files drives the
          # result; the repo's own .gitignore covers untracked build artifacts only and
          # never matches a tracked path.
          excluded_paths() {
            git -c core.excludesFile=/dev/null ls-files -i -c --exclude-from="$EXCLUDE_FILE" | sort -u
          }

          # Excluded paths that exist on main, computed from a throwaway index built
          # from main's tree. These must always end up as main's version, even if the
          # merge modified or deleted them.
          TMP_INDEX="$(mktemp -u)"
          export GIT_INDEX_FILE="$TMP_INDEX"
          git read-tree "$MAIN_HEAD"
          MAIN_MATCHED="$(excluded_paths)"
          unset GIT_INDEX_FILE
          rm -f "$TMP_INDEX"

          # Merge without committing so the excluded files never get merged in.
          # Conflicts (e.g. a file modified in dev but deleted in main) are tolerated
          # here and resolved below — for excluded files by forcing main's state, and
          # for everything else by failing loudly.
          git merge --no-ff --no-commit origin/dev || true

          # Excluded paths the merge produced (dev-only additions and modifications of
          # main's excluded files). Together with MAIN_MATCHED this is every path that
          # must be forced back to main's state.
          MERGED_MATCHED="$(excluded_paths)"

          ALL_MATCHED="$(printf '%s\n%s\n' "$MAIN_MATCHED" "$MERGED_MATCHED" | sort -u | sed '/^$/d')"
          while IFS= read -r path || [ -n "$path" ]; do
            [ -z "$path" ] && continue
            if printf '%s\n' "$MAIN_MATCHED" | grep -Fxq -- "$path"; then
              # Exists in main → discard the merge result and restore main's version
              echo "Restoring $path from main"
              rm -rf -- "$path"
              git checkout "$MAIN_HEAD" -- "$path"
            else
              # Dev-only path → keep it out of main entirely
              echo "Removing dev-only path: $path"
              git rm -rf --cached --ignore-unmatch -- "$path" >/dev/null 2>&1 || true
              rm -rf -- "$path"
            fi
          done <<< "$ALL_MATCHED"

          rm -f "$EXCLUDE_FILE"

          # Any unmerged entries left now are real conflicts in non-excluded files.
          if git ls-files --unmerged | grep -q .; then
            echo "::error::Unexpected merge conflicts remain in non-excluded files:"
            git ls-files --unmerged
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
            git commit -m "chore: auto merge dev into main [skip ci]"
            git push origin main
          else
            echo "Already up to date; nothing to merge."
          fi
