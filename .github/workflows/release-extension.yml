name: Release highlighter extension

# Manually triggered from the Actions tab. Run it on the branch that holds this
# workflow (dev) — that branch is also where editor/ lives.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: editor/vscode-cccrouter-syntax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read extension version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION"          >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"              >> "$GITHUB_OUTPUT"
          echo "vsix=cccrouter-syntax-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx --yes @vscode/vsce package

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VSIX="${{ steps.meta.outputs.vsix }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its asset."
            gh release upload "$TAG" "$VSIX" --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" "$VSIX" \
              --title "$TAG" \
              --notes "CCC Router Syntax highlighter $TAG"
          fi
